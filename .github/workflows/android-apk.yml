name: Build NOOR LIFE Android APK

on:
  push:
    branches:
      - main
      - master
  workflow_dispatch:

jobs:
  build-apk:
    name: Build Android APK & AAB
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Setup Java 21
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Install npm dependencies
        run: npm ci

      - name: Build web bundle
        run: npm run build

      - name: Sync Capacitor Android project
        run: npx cap sync android < /dev/null

      - name: Make Gradle wrapper executable
        run: chmod +x android/gradlew

      - name: Build Installable Android APK (Debug)
        working-directory: android
        run: ./gradlew assembleDebug --no-daemon

      - name: Build Android App Bundle (Release AAB)
        working-directory: android
        run: ./gradlew bundleRelease --no-daemon

      - name: Upload NOOR LIFE APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: NOOR-LIFE-Android-APK
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 30

      - name: Upload NOOR LIFE AAB Artifact
        uses: actions/upload-artifact@v4
        with:
          name: NOOR-LIFE-PlayStore-AAB
          path: android/app/build/outputs/bundle/release/app-release.aab
          if-no-files-found: warn
          retention-days: 30
